[package]
name = "hirari-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hirari DAW Project <ui@hirari-daw.io>"]
description = "Rust and AmeUI desktop application for the Hirari DAW."

[dependencies]
# 🟢 UI LAYER — AmeUI is the sole surface.
# vello must match AmeUI's own vello so the Canvas scene / device types are
# the same crate instance across the boundary.
ame-ui.workspace = true
vello.workspace = true

# 🟢 ENGINE BRIDGE
# Connects the Rust UI to the Hirari runtime and native audio boundary.
hirari-core-bridge.workspace = true

# 🟢 DATA & SERIALIZATION
serde.workspace = true
serde_json.workspace = true
hirari-moufu-adapter.workspace = true

# 🟢 UTILS & INFRASTRUCTURE
anyhow.workspace = true
log.workspace = true
rfd.workspace = true
sys-locale = "0.3"
rand = { version = "0.8.6", default-features = false, features = ["std", "std_rng"] }
