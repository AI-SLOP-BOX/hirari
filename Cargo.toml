[workspace]
members = [
    "aura-ui",
    "aura-core-bridge"
]
resolver = "2"

[workspace.dependencies]
# --- Engine Core (Shared) ---
anyhow = "1.0.104"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- UI & Frameworks ---
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "accessibility",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "unstable-wgpu-29",
] }
slint-build = "1.17.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# --- Project Paths ---
aura-core-bridge = { version = "0.1.0", path = "./aura-core-bridge" }
