[workspace]
members = [
    "hirari-ui",
    "hirari-core-bridge",
    "hirari-moufu-adapter",
    "hirari-plugin-protocol"
]
resolver = "2"

[profile.release]
panic = "abort"

[workspace.dependencies]
# --- Engine Core (Shared) ---
anyhow = "1.0.104"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
moufu-protocol = { git = "https://github.com/AI-SLOP-BOX/moufu.git", rev = "80459c64043b4f50ccbdaeeb137a78e7e4d3dbb8" }
hirari-moufu-adapter = { path = "./hirari-moufu-adapter" }

# --- UI & Frameworks ---
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "accessibility",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "raw-window-handle-06",
    "unstable-wgpu-29",
] }
raw-window-handle = "0.6"
slint-build = "1.17.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# --- Project Paths ---
hirari-core-bridge = { version = "0.1.0", path = "./hirari-core-bridge" }
