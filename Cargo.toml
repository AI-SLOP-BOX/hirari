[workspace]
members = [
    "hirari-ui",
    "hirari-core-bridge",
    "hirari-moufu-adapter",
    "hirari-plugin-protocol"
]
resolver = "2"

# `target/` measured 44G under the default dev profile (full debuginfo plus
# incremental), which left the volume at 168MiB free; `cargo clean` reported
# 112,488 files / 164.5GiB reclaimed. With this setting and one clean, the
# same workspace measures 8.0G (deps 4.4G, incremental 2.9G) and all 1328
# tests still pass.
#
# `line-tables-only` keeps file:line in panic and assert backtraces — what
# native-crash triage actually reads — and drops the type and variable
# information that accounted for some of that bulk. It is not a substitute
# for `cargo clean`: the larger share of the 44G was stale fingerprints from
# older compilations, which only a clean removes. Measured honestly, the
# individual artifacts shrank less than a headline figure would suggest (the
# hirari-core-bridge rlib went 280M -> 208M, not to tens of megabytes), so
# do not read this setting as a cleanup.
[profile.dev]
debug = "line-tables-only"

[profile.release]
panic = "abort"

[workspace.dependencies]
# --- Engine Core (Shared) ---
anyhow = "1.0.104"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
moufu-protocol = { git = "https://github.com/AI-SLOP-BOX/moufu.git", rev = "80459c64043b4f50ccbdaeeb137a78e7e4d3dbb8" }
hirari-moufu-adapter = { path = "./hirari-moufu-adapter" }

# --- UI & Frameworks ---
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "accessibility",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "raw-window-handle-06",
    "unstable-wgpu-29",
] }
raw-window-handle = "0.6"
slint-build = "1.17.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# --- Project Paths ---
hirari-core-bridge = { version = "0.1.0", path = "./hirari-core-bridge" }
