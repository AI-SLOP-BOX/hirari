[package]
name = "hirari-plugin-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Allocation-free Rust ABI primitives shared with the isolated plugin worker."

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[[bin]]
# The isolated plugin helper. It was a C++ `main` that linked this crate as an
# archive; the entry point is Rust now, so the executable is built from here.
name = "hirari-plugin-host-worker"
path = "src/bin/plugin_worker.rs"
required-features = ["worker-runtime"]

[features]
worker-runtime = []

[target.'cfg(target_os = "macos")'.dependencies]
# AudioUnit v2 hosting for sandboxed AU packages is owned by this crate's
# worker runtime; the raw AudioToolbox/CoreFoundation surface comes from
# coreaudio-sys so the worker links no C++ plugin adapter.
coreaudio-sys = { version = "0.2.18", default-features = false, features = ["audio_unit"] }
