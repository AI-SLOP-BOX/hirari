[package]
name = "aura-core-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aura DAW Project <bridge@aura-daw.io>"]
description = "A high-performance C++/Rust bridge for the Aura Unified Engine."

[dependencies]
# 🔵 FFI LAYER
# Using CXX for safer C++/Rust interoperability.
cxx = "1.0.199"

# 🔵 LOGGING & ERRORS
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode = "2.0"
sha2 = "0.11"
uuid = { version = "1.18", features = ["v4"] }

[build-dependencies]
cxx-build = "1.0.199"
glob = "0.3"
