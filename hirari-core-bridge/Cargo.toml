[package]
name = "hirari-core-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hirari DAW Project <bridge@hirari-daw.io>"]
description = "Rust DAW runtime and native audio integration boundary for Hirari."

[dependencies]
# 🔵 FFI LAYER
# Using CXX for safer C++/Rust interoperability.
cxx = "1.0.199"
arc-swap = "1.9.2"

# 🔵 LOGGING & ERRORS
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode = "1.3"
sha2 = "0.10"
roxmltree = "0.21.1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
uuid = { version = "1.18", features = ["v4"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rustfft = "6.4.1"
memmap2 = "0.9.11"
hirari-plugin-protocol = { path = "../hirari-plugin-protocol" }

[target.'cfg(unix)'.dependencies]
# The Rust plugin sandbox host owns posix_spawn, pipes, shm_open/mmap, poll,
# and waitpid. libc's platform-correct constants keep that supervisor honest
# without reintroducing a C++ lifecycle layer.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS device host is owned by Rust. `coreaudio-rs` supplies the typed
# AudioUnit scope/element enums; `coreaudio-sys` is the raw HAL/MIDI surface.
coreaudio-rs = { version = "0.11.3", default-features = false, features = ["audio_unit"] }
coreaudio-sys = { version = "0.2.18", default-features = false, features = [
    "audio_unit",
    "core_audio",
    "core_midi",
] }
# Video preview decoding is Rust-owned too: `objc2-av-foundation` supplies the
# asset/image-generator classes, `block2` the completion handlers they require,
# and the CoreGraphics/CoreMedia bindings the RGBA blit and CMTime math.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSString",
    "NSURL",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = [
    "CGImage",
    "CGColorSpace",
    "CGContext",
] }
objc2-core-media = "0.3"
objc2-av-foundation = { version = "0.3", features = [
    "AVAsset",
    "AVAssetImageGenerator",
    "AVAssetTrack",
    "AVMediaFormat",
    "block2",
    "objc2-core-graphics",
    "objc2-core-media",
] }

[build-dependencies]
cxx-build = "1.0.199"
glob = "0.3"

[features]
dsp-differential-reference = []
