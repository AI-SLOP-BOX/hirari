name: Portable build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      # The ame-ui path dependency is a private, unpublished crate; GitHub
      # hosts cannot check it out. `scripts/ensure_ameui_stub.sh` creates a
      # manifest-only placeholder so `cargo metadata` can resolve. The
      # placeholder is never built (nothing besides hirari-ui references
      # ame-ui) and this job covers only the engine crates.
      - name: Provide a manifest-only placeholder for the private AmeUI crate
        run: ./scripts/ensure_ameui_stub.sh
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Compile the engine crates
        run: cargo check -p hirari-core-bridge -p hirari-moufu-adapter -p hirari-plugin-protocol --locked
      - name: Compare Rust DSP output with frozen C++ references
        run: >-
          cargo test -p hirari-core-bridge --lib --locked
          --features dsp-differential-reference differential_tests
          -- --test-threads=1
